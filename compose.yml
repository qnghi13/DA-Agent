# DA-Agent, self-hosted. Copy .env.example to .env, fill it in, then: docker compose up -d --build
# Or run released images instead of building: set DA_AGENT_IMAGE and DA_AGENT_TAG (.env.example).
# The UI is at http://127.0.0.1:8080. Create a workspace key with:
#   docker compose exec api python -m da_agent.admin create-workspace "My shop"
# Design: docs/adr/0024-runner-service.md. Only the runner mounts the Docker socket.
name: da-agent

x-app: &app
  image: ${DA_AGENT_IMAGE:-da-agent}:${DA_AGENT_TAG:-compose}
  build:
    context: .
    dockerfile: deploy/app.Dockerfile
    target: app
    # The commit for the agent manifest (ADR 0038): DA_AGENT_GIT_SHA=$(git rev-parse HEAD)
    args:
      DA_AGENT_GIT_SHA: ${DA_AGENT_GIT_SHA:-unknown}
  restart: unless-stopped
  volumes:
    - data:/data

x-database-url: &database-url postgresql://da_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/da_agent

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_USER: da_agent
      POSTGRES_DB: da_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "da_agent", "-d", "da_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Builds the sandbox image the runner starts, then exits.
  sandbox:
    image: ${DA_AGENT_IMAGE:-da-agent}-sandbox:${DA_AGENT_TAG:-compose}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    entrypoint: ["python", "-c", "pass"]
    network_mode: none
    restart: "no"

  runner:
    image: ${DA_AGENT_IMAGE:-da-agent}-runner:${DA_AGENT_TAG:-compose}
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      target: runner
      args:
        DA_AGENT_GIT_SHA: ${DA_AGENT_GIT_SHA:-unknown}
    command: ["python", "-m", "da_agent.runner", "--host", "0.0.0.0", "--port", "8100"]
    restart: unless-stopped
    # No database URL and no provider keys: the runner only starts sandboxes.
    environment:
      DA_AGENT_DATA_DIR: /data
      DA_AGENT_DATA_VOLUME: da-agent-data
      DA_AGENT_SANDBOX_IMAGE: ${DA_AGENT_IMAGE:-da-agent}-sandbox:${DA_AGENT_TAG:-compose}
      DA_AGENT_SANDBOX_USER: "10001:10001"
      DA_AGENT_RUNNER_TOKEN: ${DA_AGENT_RUNNER_TOKEN:?set DA_AGENT_RUNNER_TOKEN in .env}
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [backend]
    depends_on:
      sandbox:
        condition: service_completed_successfully
      # Docker fills an empty named volume from the first container's image, with the app user's
      # ownership. The API and the Runner share `data`; created together, both copy and one fails
      # with "mkdir /data/uploads: file exists". Waiting for the API makes it the only copier.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: ["python", "-m", "da_agent.api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DA_AGENT_DATABASE_URL: *database-url
      DA_AGENT_DAILY_BUDGET_USD: ${DA_AGENT_DAILY_BUDGET_USD:-5.0}
      DA_AGENT_TRACE_UI_URL: ${DA_AGENT_TRACE_UI_URL:-}
      # Login links point here, and browser requests must come from this origin (ADR 0025).
      DA_AGENT_PUBLIC_URL: ${DA_AGENT_PUBLIC_URL:-http://127.0.0.1:${DA_AGENT_WEB_PORT:-8080}}
      # The API is reachable only through the web proxy, which sets X-Forwarded-For itself.
      FORWARDED_ALLOW_IPS: "*"
      # Prometheus scrapes port 9100 inside the Compose networks; it is never published.
      DA_AGENT_METRICS_PORT: "9100"
      DA_AGENT_ALERTMANAGER_URL: http://alertmanager:9093
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: ["python", "-m", "da_agent.worker"]
    environment:
      DA_AGENT_DATABASE_URL: *database-url
      DA_AGENT_ROUTES: ${DA_AGENT_ROUTES:-groq:openai/gpt-oss-20b}
      DA_AGENT_METRICS_PORT: "9100"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DA_AGENT_DAILY_BUDGET_USD: ${DA_AGENT_DAILY_BUDGET_USD:-5.0}
      DA_AGENT_RUN_BUDGET_USD: ${DA_AGENT_RUN_BUDGET_USD:-0.25}
      DA_AGENT_RUN_MAX_SECONDS: ${DA_AGENT_RUN_MAX_SECONDS:-300}
      # Model call limits and breaker (ADR 0041); empty means the defaults.
      DA_AGENT_ROUTE_LIMITS: ${DA_AGENT_ROUTE_LIMITS:-}
      DA_AGENT_RATE_LIMITER: ${DA_AGENT_RATE_LIMITER:-postgres}
      DA_AGENT_BREAKER_FAILURES: ${DA_AGENT_BREAKER_FAILURES:-}
      DA_AGENT_BREAKER_COOLDOWN_SECONDS: ${DA_AGENT_BREAKER_COOLDOWN_SECONDS:-}
      DA_AGENT_RUNNER_URL: http://runner:8100
      DA_AGENT_RUNNER_TOKEN: ${DA_AGENT_RUNNER_TOKEN:?set DA_AGENT_RUNNER_TOKEN in .env}
      DA_AGENT_SANDBOX_USER: "10001:10001"
      DA_AGENT_OTLP_ENDPOINT: http://phoenix:6006/v1/traces
    # edge gives the worker internet access for model providers.
    networks: [backend, edge]
    depends_on:
      api:
        condition: service_healthy
      runner:
        condition: service_healthy

  web:
    image: ${DA_AGENT_IMAGE:-da-agent}-web:${DA_AGENT_TAG:-compose}
    build: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DA_AGENT_WEB_PORT:-8080}:8080"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  phoenix:
    image: arizephoenix/phoenix:version-21.0.0@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    restart: unless-stopped
    ports:
      # Localhost only: traces hold prompts and cell values from every workspace.
      - "127.0.0.1:${DA_AGENT_PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
    volumes:
      - phoenix-data:/mnt/data
    networks: [backend, edge]

  # SLOs and alerts (ADR 0044): Prometheus scrapes api and every worker on port 9100, records
  # SLIs, and sends alerts to Alertmanager, which groups them and calls the webhook.
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${DA_AGENT_PROMETHEUS_PORT:-9090}:9090"
    networks: [backend, edge]

  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    environment:
      DA_AGENT_ALERT_WEBHOOK_URL: ${DA_AGENT_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${DA_AGENT_ALERTMANAGER_PORT:-9093}:9093"
    # edge reaches the webhook; backend reaches Prometheus and the API.
    networks: [backend, edge]

networks:
  # No route out: postgres and the runner live only here.
  backend:
    internal: true
  edge: {}

volumes:
  data:
    # A fixed name, because the runner passes it to the sandboxes it starts.
    name: da-agent-data
  postgres-data:
  phoenix-data:
  prometheus-data:
  alertmanager-data:
