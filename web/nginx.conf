# Same origin for the UI and the API, as the Vite proxy gives in development: no CORS needed.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Scripts are not restricted here: the report iframe (srcdoc) inherits this policy and loads
    # pinned chart libraries with its own stricter policy.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaces, never appends: a client cannot forge the address the rate limits see.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads stream to the API, which enforces its own size limits.
        client_max_body_size 0;
        proxy_request_buffering off;
        # Server-sent events: pass each event on at once, and keep long runs open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
