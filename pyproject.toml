[project]
name = "da-agent"
version = "0.0.0"
description = "Open-source agent that analyses uploaded tabular data"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "openai>=3.46.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "sqlglot>=30.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/da_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = ["train"]
src = ["src", "."]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # likely bugs
  "UP",  # modern Python syntax
  "SIM", # simplifications
  "RUF", # ruff-specific checks
  "S",   # security checks, relevant for an agent that runs generated code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
".claude/hooks/**" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m 'not llm'"
markers = [
  "llm: calls a real LLM and costs money or quota, excluded by default",
  "integration: needs Docker or Postgres",
  "security: proves that a sandbox, SQL, or isolation boundary holds",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
